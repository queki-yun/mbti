<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI 性格测试</title>
  <style>
/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f0f4f8;
  --card-bg: #ffffff;
  --text: #2d3748;
  --text-secondary: #718096;
  --primary: #667eea;
  --primary-light: #764ba2;
  --accent: #48bb78;
  --accent-light: #9ae6b4;
  --danger: #fc8181;
  --border: #e2e8f0;
  --shadow: 0 4px 24px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.10);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.25s ease;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

body {
  font-family: var(--font);
  background: linear-gradient(135deg, #e0e7ff 0%, #f0f4f8 30%, #e8f0fe 70%, #ede9fe 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: var(--text);
  line-height: 1.6;
}

.container {
  width: 100%;
  max-width: 720px;
}

/* ========== Page Switching ========== */
.page { display: none; }
.page.active { display: block; animation: fadeIn 0.4s ease; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ========== Card ========== */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: box-shadow var(--transition);
}
.card:hover { box-shadow: var(--shadow-lg); }

.card-bar {
  height: 5px;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
}

.card-body { padding: 36px 32px; }

/* ========== Home Page ========== */
.home-card .card-body { text-align: center; padding: 48px 32px 40px; }

.home-card h1 {
  font-size: 2.2rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}

.subtitle {
  font-size: 0.95rem;
  color: var(--text-secondary);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 20px;
}

.desc {
  font-size: 0.95rem;
  color: var(--text-secondary);
  line-height: 1.8;
  margin-bottom: 32px;
}

/* Version Picker */
.version-picker {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}

.version-option {
  position: relative;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px 10px;
  cursor: pointer;
  transition: all var(--transition);
  background: #fafbfc;
}
.version-option:hover { border-color: #c4b5fd; background: #f5f3ff; }
.version-option.active {
  border-color: var(--primary);
  background: linear-gradient(135deg, #ede9fe, #e0e7ff);
  box-shadow: 0 0 0 3px rgba(102,126,234,0.12);
}

.version-name { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
.version-desc { font-size: 0.8rem; color: var(--text-secondary); }

.version-badge {
  position: absolute;
  top: -10px;
  right: -10px;
  background: var(--accent);
  color: #fff;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 20px;
  letter-spacing: 0.5px;
}

.btn-start {
  display: inline-block;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
  border: none;
  padding: 14px 56px;
  font-size: 1.1rem;
  font-weight: 700;
  border-radius: 50px;
  cursor: pointer;
  transition: all var(--transition);
  letter-spacing: 1px;
  box-shadow: 0 4px 16px rgba(102,126,234,0.35);
}
.btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(102,126,234,0.45); }
.btn-start:active { transform: translateY(0); }

/* ========== Quiz Page ========== */
.quiz-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 28px 0;
}

.quiz-title { font-weight: 700; font-size: 1rem; color: var(--primary); }
.quiz-progress-num { font-size: 0.9rem; color: var(--text-secondary); font-weight: 600; }

.quiz-question {
  padding: 20px 28px 12px;
  font-size: 1.15rem;
  font-weight: 600;
  line-height: 1.7;
  color: var(--text);
  min-height: 70px;
}

.quiz-hint {
  padding: 0 28px 16px;
  font-size: 0.82rem;
  color: var(--text-secondary);
}

/* Scale */
.scale-area { padding: 0 28px 24px; }
.scale-labels {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

.scale-dots {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  margin: 0 -4px;
}

.scale-dot {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #edf2f7;
  border: 2px solid var(--border);
  cursor: pointer;
  transition: all 0.18s ease;
  position: relative;
}
.scale-dot:hover { border-color: var(--primary); background: #e0e7ff; transform: scale(1.12); }
.scale-dot.selected {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(102,126,234,0.18);
  transform: scale(1.12);
}

.scale-values {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  color: var(--text-secondary);
  font-weight: 600;
  margin-top: 6px;
  padding: 0 4px;
}

/* Progress */
.progress-section { padding: 0 28px 20px; }
.progress-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
.progress-label { font-size: 0.82rem; color: var(--text-secondary); }
.progress-percent { font-size: 0.82rem; font-weight: 700; color: var(--primary); }

.progress-track {
  height: 8px;
  background: #edf2f7;
  border-radius: 10px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
  border-radius: 10px;
  transition: width 0.35s ease;
  width: 0%;
}

/* Nav Buttons */
.quiz-nav {
  display: flex;
  justify-content: space-between;
  padding: 0 28px 24px;
  gap: 12px;
}

.btn-prev, .btn-next, .btn-submit {
  padding: 10px 24px;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all var(--transition);
}
.btn-prev {
  background: #edf2f7;
  color: var(--text-secondary);
}
.btn-prev:hover:not(:disabled) { background: #e2e8f0; }
.btn-prev:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-next {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
  margin-left: auto;
}
.btn-next:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.3); }

.btn-submit {
  background: linear-gradient(135deg, var(--accent), #38a169);
  color: #fff;
  margin-left: auto;
}
.btn-submit:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(72,187,120,0.35); }
.btn-submit:disabled {
  background: #cbd5e0;
  color: #a0aec0;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}

.submit-hint {
  display: inline-flex;
  align-items: center;
  font-size: 0.82rem;
  color: #e53e3e;
  font-weight: 600;
  margin-left: 12px;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* ========== Report Page ========== */
.report-page { padding-bottom: 40px; }

.report-hero {
  background: linear-gradient(135deg, #1a202c, #2d3748);
  color: #fff;
  text-align: center;
  padding: 40px 28px 36px;
  border-radius: var(--radius) var(--radius) 0 0;
}

.report-type-badge {
  display: inline-block;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  padding: 6px 20px;
  border-radius: 30px;
  font-size: 0.85rem;
  letter-spacing: 3px;
  font-weight: 600;
  margin-bottom: 12px;
}

.report-type-name {
  font-size: 1.6rem;
  font-weight: 800;
  margin-bottom: 4px;
}
.report-type-title { font-size: 0.95rem; opacity: 0.8; }

.report-body { padding: 28px; }

/* Features Tags */
.report-features {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}
.report-feature-tag {
  background: #ede9fe;
  color: #6d28d9;
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 0.82rem;
  font-weight: 600;
}

/* Section */
.report-section { margin-bottom: 24px; }
.report-section h3 {
  font-size: 1.05rem;
  font-weight: 700;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
}
.report-section h3::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 20px;
  background: linear-gradient(180deg, var(--primary), var(--primary-light));
  border-radius: 2px;
}

.report-desc {
  font-size: 0.92rem;
  line-height: 1.85;
  color: var(--text);
  white-space: pre-line;
  background: #f7fafc;
  padding: 16px;
  border-radius: var(--radius-sm);
}

.report-list { list-style: none; padding: 0; }
.report-list li {
  padding: 7px 0 7px 20px;
  position: relative;
  font-size: 0.9rem;
  line-height: 1.6;
}
.report-list.strengths li::before {
  content: '+';
  position: absolute;
  left: 0;
  color: var(--accent);
  font-weight: 700;
}
.report-list.weaknesses li::before {
  content: '−';
  position: absolute;
  left: 0;
  color: var(--danger);
  font-weight: 700;
}

/* Career Table */
.report-career-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}
.report-career-table th {
  text-align: left;
  background: #f7fafc;
  padding: 10px 14px;
  font-weight: 700;
  border-bottom: 2px solid var(--border);
}
.report-career-table td {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
}
.report-career-table tr:last-child td { border-bottom: none; }

/* Figures */
.report-figures {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.report-figure-tag {
  background: #fefcbf;
  color: #975a16;
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 0.82rem;
  font-weight: 600;
}

/* Chart Container */
.report-chart-container {
  margin-bottom: 24px;
  text-align: center;
}
.report-chart-container canvas { max-width: 300px; }

/* Restart Button */
.report-restart {
  text-align: center;
  margin-top: 8px;
}
.btn-restart {
  display: inline-block;
  background: var(--card-bg);
  color: var(--primary);
  border: 2px solid var(--primary);
  padding: 12px 40px;
  font-size: 1rem;
  font-weight: 700;
  border-radius: 50px;
  cursor: pointer;
  transition: all var(--transition);
}
.btn-restart:hover { background: var(--primary); color: #fff; }

/* ========== Responsive ========== */
@media (max-width: 640px) {
  .card-body { padding: 24px 18px; }
  .home-card .card-body { padding: 32px 18px 28px; }
  .version-picker { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .version-option { padding: 12px 6px; }
  .version-name { font-size: 0.85rem; }
  .version-desc { font-size: 0.7rem; }
  .btn-start { padding: 12px 40px; font-size: 1rem; }
  .quiz-question { font-size: 1.05rem; padding: 16px 18px 8px; }
  .scale-area { padding: 0 18px 20px; }
  .scale-dot { width: 28px; height: 28px; }
  .scale-values { font-size: 0.7rem; }
  .quiz-nav { padding: 0 18px 20px; }
  .report-hero { padding: 28px 18px; }
  .report-body { padding: 20px 18px; }
}
  </style>
</head>
<body>
  <div class="container">

    <!-- ===== 首页 ===== -->
    <div id="home-page" class="page active">
      <div class="card home-card">
        <div class="card-bar"></div>
        <div class="card-body">
          <h1>MBTI 性格测试</h1>
          <p class="subtitle">Discover Your Personality Type</p>
          <p class="desc">
            基于荣格心理学理论，从四个维度揭示你的性格类型。<br>
            请根据真实感受作答，选择适合你的版本开始。
          </p>
          <div class="version-picker" id="version-picker">
            <div class="version-option active" data-version="basic">
              <div class="version-name">基础版</div>
              <div class="version-desc">24 题 · 约 3 分钟</div>
            </div>
            <div class="version-option" data-version="advanced">
              <div class="version-name">进阶版</div>
              <div class="version-desc">80 题 · 约 10 分钟</div>
              <div class="version-badge">推荐</div>
            </div>
            <div class="version-option" data-version="full">
              <div class="version-name">完整版</div>
              <div class="version-desc">120 题 · 约 15 分钟</div>
            </div>
          </div>
          <button class="btn-start" id="btn-start">开始测试</button>
        </div>
      </div>
    </div>

    <!-- ===== 答题页 ===== -->
    <div id="quiz-page" class="page">
      <div class="card">
        <div class="card-bar"></div>
        <div class="quiz-header">
          <span class="quiz-title">MBTI 性格测试</span>
          <span class="quiz-progress-num" id="quiz-progress-num">1 / 80</span>
        </div>
        <div class="quiz-question" id="quiz-title"></div>
        <div class="quiz-hint">滑动选择最符合的程度 · 左端为"非常不同意"，右端为"非常同意"</div>
        <div class="scale-area">
          <div class="scale-labels">
            <span>非常不同意</span>
            <span>非常同意</span>
          </div>
          <div class="scale-dots" id="scale-dots"></div>
          <div class="scale-values">
            <span>-3</span><span>-2</span><span>-1</span><span>0</span><span>+1</span><span>+2</span><span>+3</span>
          </div>
        </div>
        <div class="progress-section">
          <div class="progress-header">
            <span class="progress-label">完成进度</span>
            <span class="progress-percent" id="progress-percent">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
        <div class="quiz-nav">
          <button class="btn-prev" id="btn-prev" disabled>← 上一题</button>
          <button class="btn-next" id="btn-next">下一题 →</button>
          <button class="btn-submit" id="btn-submit" style="display:none;">提交 & 查看结果</button>
          <span class="submit-hint" id="submit-hint" style="display:none;"></span>
        </div>
      </div>
    </div>

    <!-- ===== 报告页 ===== -->
    <div id="report-page" class="page report-page"></div>

  </div>

  <script>
/* ========== MBTI 16型人格完整画像数据 ========== */
window.MBTI_PROFILES = {
  "INTJ":{"type":"INTJ","name":"建筑师","features":["战略思维","独立思考","高度自律","追求完美","远见卓识","理性冷静","知识渊博"],"desc":"INTJ 是十六型人格中最为独立和战略性的类型之一，占总人口约 2%，是极其罕见的类型。他们拥有强烈的内在愿景，善于制定长远计划并坚定不移地执行。对 INTJ 来说，世界是一个巨大的、等待被理解和优化的复杂系统——他们享受拆解问题、找到根本逻辑、并设计优雅解决方案的智力快感。\n\nINTJ 对知识有着近乎贪婪的渴求，不满足于表面答案，总在追问“为什么”。他们不盲从权威，也不会为了迎合他人而改变自己的判断。在社交场合中，INTJ 可能显得疏离和内敛，但这并非冷漠——他们只是更倾向于将精力投入到有意义的深度交流中，而非消耗在闲聊寒暄上。独处对 INTJ 而言不是孤独，而是充电和思考的必需品。","strengths":["战略规划能力强，能看到全局和长远趋势","高度独立和自律，不依赖外部激励就能推动自己","善于分析复杂问题，总能找到根本原因而非治标","对自己和他人都有高标准，追求持续进步","知识渊博，在各领域都有深入的研究和见解","在危机中保持冷静理性，不被情绪裹挟","能将抽象理论转化为切实可行的行动计划"],"weaknesses":["可能显得傲慢和难以接近，让他人感到距离感","对他人情感需求不够敏感，容易伤害在乎的人","过度追求完美导致拖延和迟迟不肯交付","不善于处理模糊和不确定的情境，容易焦虑","社交场合容易感到疲惫，需要大量独处恢复","有时过度自信于自己的判断，忽略他人有价值的意见","在团队合作中可能独断专行，不愿委派任务"],"careers":[{"title":"战略顾问","reason":"善于系统思考和长远规划，能穿透表象看到本质"},{"title":"软件架构师","reason":"擅长抽象思维和复杂系统设计，追求优雅的解决方案"},{"title":"科学研究员","reason":"对深度探索和理论钻研有内在热情"},{"title":"投资分析师","reason":"能够客观分析数据和趋势，不受市场情绪左右"},{"title":"大学教授","reason":"乐于深度研究和知识传播，享受学术自由"},{"title":"工程师","reason":"善于优化和改进复杂系统"},{"title":"律师/法官","reason":"逻辑严密，善于构建无懈可击的论证"},{"title":"企业CEO/CTO","reason":"长远的战略视野和果断的决策能力"}],"relationships":"在人际关系中，INTJ 更看重质量而非数量。他们倾向于保持一个小而精的社交圈，对朋友忠诚且可靠——如果你能被 INTJ 纳入信任圈，你将拥有一个在任何困境中都不会退缩的盟友。INTJ 表达关心的方式往往是通过解决问题和提供有价值的建议，而非传统的温暖言辞。\n\n在亲密关系中，INTJ 欣赏理性、独立且能与他们进行智力对话的伴侣。他们追求共同成长的关系，希望伴侣能理解他们对独处和深度思考的需求。INTJ 不会轻易投入感情，但一旦认定某人，会用行动证明忠诚。需要注意的是，INTJ 有时会过度分析关系问题，把感情当成需要被“解决”的方程式——建议学会更直接地表达情感，不是所有问题都需要一个完美的解决方案。","development":"1. 刻意练习共情能力，主动询问他人感受而非仅关注事实\n2. 学会接受“够好”而非“完美”，在 80% 完成度时勇敢交付\n3. 主动参与社交活动，将人际网络视为值得投资的长期资产\n4. 练习将复杂想法用通俗语言表达，降低沟通门槛\n5. 在团队中尝试更多协作和委派，相信他人的能力\n6. 定期反思自己的情绪状态，承认感受也是合理的信息来源\n7. 培养一项需要与他人实时互动的爱好，平衡内在思考世界","figures":["埃隆·马斯克","弗里德里希·尼采","简·奥斯汀","克里斯托弗·诺兰","阿诺德·施瓦辛格","马克·扎克伯格","艾萨克·牛顿"]},
  "INTP":{"type":"INTP","name":"逻辑学家","features":["逻辑分析","创新思维","好奇心旺盛","客观冷静","不拘常规","深度钻研","独立自主"],"desc":"INTP 是天生的思想家和创新者，约占人口 3%。他们的脑海中永远回荡着“为什么”和“如果呢”，驱动他们不断探索事物的本质。INTP 享受构建理论框架和知识体系的纯粹乐趣，在抽象概念的世界中如鱼得水。他们不以常规为准则，总能用独特的视角发现别人看不到的联系。\n\n在日常社交中，INTP 可能显得有些心不在焉或不合群——但这只是因为他们的大脑正忙着处理比闲聊更有趣的问题。对于真正感兴趣的话题，INTP 能够展现惊人的热情和深度。他们珍视智力上的诚实，宁可面对令人不适的真相，也不愿接受令人安心的谎言。INTP 是那种会在凌晨三点突然坐起来，因为终于想通了某个困扰已久的问题而激动不已的人。","strengths":["极强的逻辑推理和分析能力，擅长发现思维漏洞","好奇心驱动持续学习和探索，永不满足于表面答案","善于发现模式和潜在规律，能从海量信息中提炼本质","客观公正，不轻易被情绪左右决策","富有创造力和创新精神，敢于挑战既有范式","能够在复杂抽象的概念之间建立独特的联系","对知识保持开放态度，愿意随时修正错误认知"],"weaknesses":["容易陷入过度分析而无法行动，成为“思想的巨人行动的矮子”","对日常琐事缺乏兴趣和耐心，生活可能混乱无序","社交上可能显得疏离和冷漠，让他人感觉被忽视","难以在截止日期前完成工作，对时间管理缺乏概念","可能忽视现实世界的实际限制，想法有时过于理想化","在与情绪化人群交流时感到极度不适和无力","容易从一个兴趣跳到另一个，难以长期专注单一领域"],"careers":[{"title":"数据科学家","reason":"善于从数据中发现规律和洞察"},{"title":"哲学家/理论家","reason":"对抽象概念和逻辑体系有浓厚兴趣"},{"title":"游戏设计师","reason":"喜欢设计复杂系统和规则"},{"title":"程序员/软件工程师","reason":"享受解谜和逻辑构建的过程"},{"title":"数学家/物理学家","reason":"对纯粹的逻辑和抽象结构着迷"},{"title":"技术作家","reason":"能将复杂概念清晰阐述"},{"title":"AI 研究员","reason":"热爱探索智能的本质和可能性"},{"title":"犯罪分析师","reason":"擅长从蛛丝马迹中构建逻辑链条"}],"relationships":"INTP 在人际关系中真诚而低调。他们不擅长社交游戏或表面客套，但对真正感兴趣的对话者能展现出惊人的热情和深度。INTP 的朋友圈通常小而精，他们宁愿有一个能讨论宇宙本质的知己，也不要一百个只聊天气的点头之交。\n\nINTP 在伴侣关系中看重智力上的匹配，希望对方能理解并尊重他们对独处和思考空间的需求。他们表达爱的方式更多是解决问题和提供洞见，而非传统的浪漫举动。INTP 的伴侣需要理解：当 INTP 在沉默中发呆时，他们不是在冷落你，而是在脑海中构建一个全新的理论。学会主动表达情感和用言语传递关心，是 INTP 在亲密关系中最需要成长的课题。","development":"1. 培养执行力，将分析和计划转化为实际行动，哪怕只是很小的一步\n2. 学习关注并回应他人的情感需求，有时一个拥抱比一个分析更有用\n3. 建立基本的生活规律和时间管理习惯，用外部框架弥补内部随性\n4. 尝试用简洁的方式解释复杂想法，提升沟通效率\n5. 主动走出舒适区，参与需要即时反应的社交和实践活动\n6. 选择一个核心项目坚持到底，体验“完成”带来的满足感\n7. 练习感恩和表达欣赏，即使是以你最舒服的逻辑方式","figures":["阿尔伯特·爱因斯坦","查尔斯·达尔文","玛丽·居里","比尔·盖茨","卡尔·荣格","勒内·笛卡尔","伊曼努尔·康德"]},
  "ENTJ":{"type":"ENTJ","name":"指挥官","features":["果断决策","领导力强","目标导向","自信坚定","高效务实","战略远见","意志坚韧"],"desc":"ENTJ 是天生的领导者，约占人口 3%。他们拥有清晰的愿景、强大的组织能力和令人信服的感染力，能够将分散的资源和人高效地整合到共同目标之下。ENTJ 不畏艰难决策，在压力下依然保持冷静和果断——对他们而言，困难不是障碍，而是证明自己的舞台。\n\nENTJ 的脑海中总是运转着一张巨大的战略地图：哪里有机会、哪里有风险、谁适合什么位置、下一步该往哪个方向——这一切在他们看来都清晰无比。他们享受将混乱变为秩序的过程，就像下棋高手在棋盘上步步为营。在人际交往中，ENTJ 直接而坦率，有时可能显得过于强势——但这份强势往往出自对效率和结果的真诚追求，而非傲慢。","strengths":["卓越的领导能力和组织才能，能指挥百人如臂使指","自信果断，能在关键时刻快速做出艰难决策","目标感极强，能持续推动团队克服万难前进","善于发现他人的潜力并安排到最适合的位置","面对挑战和压力表现出色，愈挫愈勇","拥有宏大的战略视野，能提前布局数年后的棋局","执行力惊人，从不满足于纸上谈兵"],"weaknesses":["可能显得专断和不近人情，容不下不同节奏的人","对效率的追求有时伤害人际关系和团队士气","不善于耐心倾听和提供情感层面的支持","可能低估实现目标所需的现实困难，过于乐观","对不够能干的人缺乏耐心，容易让人感到压力","在情感表达上生硬直接，可能伤害伴侣的感受","习惯了掌控局面，难以接受失控和不确定性"],"careers":[{"title":"企业CEO/高管","reason":"与生俱来的战略视野和领导才能"},{"title":"政治领袖","reason":"善于组织和动员人力实现远大目标"},{"title":"创业家","reason":"敢于冒险且拥有强大的执行力"},{"title":"管理顾问","reason":"善于诊断组织问题和推动变革"},{"title":"律师/法官","reason":"逻辑严谨且辩论能力出类拔萃"},{"title":"军事指挥官","reason":"决策果断且战略性思考"},{"title":"投资银行家","reason":"在高压快节奏环境中游刃有余"},{"title":"大学校长","reason":"善于统筹资源和引领机构方向"}],"relationships":"ENTJ 将关系中同样追求进步和成长。他们倾向于主导关系的发展方向，会为伴侣规划未来并积极推动两人共同前进。ENTJ 需要的伴侣是能够坦诚沟通且不被他们强势风格所压倒的独立个体——欣赏他们的能力但不依赖他们。\n\nENTJ 对伴侣忠诚而支持，会不遗余力地帮助对方实现个人目标——有时甚至比对方自身更积极。然而，他们需要意识到并非所有人都以相同方式感受和表达爱。ENTJ 倾向于用“解决你的问题”来表达关心，但有时伴侣只需要“被倾听”而非“被方案”。学会在推动和目标之间留出一些空间，让关系自由呼吸，是 ENTJ 长期幸福感的关键。","development":"1. 练习主动倾听，给他人充分表达的空间而非立即给出方案\n2. 学习欣赏不同节奏和风格的人，理解“慢”不等于“差”\n3. 在追求目标的同时兼顾团队成员的情感需求和幸福感\n4. 偶尔放慢脚步，享受过程而非只看终点\n5. 培养耐心，理解有些事需要时间而非强力推动\n6. 学会表达脆弱和不完美的一面，这反而能增强信任\n7. 培养一项与效率无关的兴趣，纯粹为了快乐","figures":["史蒂夫·乔布斯","拿破仑·波拿巴","玛格丽特·撒切尔","戈登·拉姆齐","富兰克林·D·罗斯福","谢尔盖·布林","乔治·克鲁尼"]},
  "ENTP":{"type":"ENTP","name":"辩论家","features":["机智敏捷","善于辩论","创新冒险","热情洋溢","不拘一格","好奇心强","思维活跃"],"desc":"ENTP 是思想世界的探险家，约占人口 3%。他们有着永不满足的好奇心和敏捷的头脑，在辩论和观念交锋中感受到纯粹的智力快乐。ENTP 善于从不同角度审视问题，总能找到别人忽略的可能性和漏洞。他们不喜欢被规则束缚，更享受在可能性的广阔天地中自由驰骋。\n\n在社交场合，ENTP 通常是人群中的焦点——机智、幽默、能言善辩，能轻松地将看似无关的话题连成一幅精彩的思想地图。他们享受扮演“魔鬼代言人”的角色，不是因为固执己见，而是因为探索一个想法的最佳方式就是挑战它。ENTP 是那种聊着聊着突然冒出三个创业点子、又在半小时后彻底推翻重新构建的人——对他们而言，思考本身就是最好的娱乐。","strengths":["思维敏捷，善于临场发挥和即兴辩论","富有创意和横向联想能力，脑洞大开","善于发现问题和提出改进方案，天生的优化者","社交能力强，能快速与任何人建立连接","对新鲜事物充满热情和学习动力，永不厌倦","能在复杂多变的环境中快速适应和找到出路","拥有强大的说服力，能感染他人接受新想法"],"weaknesses":["容易半途而废，难以将想法贯彻到底","可能因喜欢争论而伤害他人感情而不自知","对日常惯例和重复工作缺乏耐心，容易厌倦","有时忽视细节和执行层面的问题，只看大方向","可能同时开启过多项目却都未完成","在情感层面可能不够细腻，关系有时流于表面","对权威和规则的本能抗拒可能导致不必要的冲突"],"careers":[{"title":"创业者/企业家","reason":"善于发现机会和突破常规"},{"title":"产品经理","reason":"擅长从多角度思考产品创新和改进"},{"title":"记者/评论员","reason":"思维敏捷且善于表达独特观点"},{"title":"广告创意人","reason":"脑洞大且善于抓住眼球"},{"title":"律师/诉讼律师","reason":"擅长辩论和多角度论证"},{"title":"发明家/创新顾问","reason":"热衷于探索全新的解决方案"},{"title":"大学教授","reason":"享受思维碰撞和启发学生"},{"title":"政治评论家","reason":"敏锐的洞察力和不拘一格的表达"}],"relationships":"ENTP 在人际关系中充满活力和趣味，他们善于用幽默和智慧拉近距离，是派对上最受欢迎的那类人。ENTP 欣赏能与他们进行智力较量的伴侣，喜欢关系中的新鲜感和成长性——一段停滞不前的关系会让 ENTP 感到窒息。\n\nENTP 可能不够细腻，有时会因追求辩论的乐趣而忽视对方的情感需求。他们需要意识到，并非所有对话都需要分出胜负，有时候沉默和倾听比机智的反驳更有力量。ENTP 在亲密关系中最大的挑战是：如何在保持思想和精神自由的同时，给予伴侣足够的安全感和持续的专注。学会在同一段关系中发现无限的新鲜感，而非不断寻找新的刺激源，是他们走向成熟关系的必修课。","development":"1. 学会将一个想法贯彻到底，体验完整的创造周期\n2. 注意在讨论中留出倾听空间，克制“必须回应”的冲动\n3. 建立基本的时间管理和项目追踪习惯\n4. 学习感知和尊重他人的情感边界\n5. 对日常事务和细节给予应有的重视\n6. 选择一个长期项目深耕，不是所有探索都需要更换跑道\n7. 练习在沉默中感受关系，不总是需要用语言填满每一刻","figures":["托马斯·爱迪生","马克·吐温","本杰明·富兰克林","小罗伯特·唐尼","苏格拉底","沃尔特·迪斯尼","莱昂纳多·达·芬奇"]},
  "INFJ":{"type":"INFJ","name":"提倡者","features":["理想主义","深刻洞察","坚定信念","利他精神","富有创造力","直觉敏锐","温和坚定"],"desc":"INFJ 是十六型人格中最稀有的类型之一，仅占人口约 1-2%，以深刻的洞察力和坚定的理想主义著称。他们拥有近乎神秘般的直觉，能够感知到人和事物表层之下的深层本质和潜在可能。INFJ 内心燃烧着让世界变得更美好的强烈渴望，并将这份渴望转化为持续的具体行动。\n\n他们善于用富有感染力的语言和文字传达复杂的理念，激励他人向善向上。在人际交往中，INFJ 温柔而深邃，能够建立少数但极为深刻的情感连接。他们像是人性深海中的潜水员，能看到别人看不到的珍珠和暗流。INFJ 的脑海中永远在进行着一场复杂的内心对话，分析着世界、人际关系和生命意义，这种深度让他们的内心生活异常丰富，但也容易让他们感到与周围世界的格格不入。","strengths":["深刻的洞察力和直觉判断，往往能预见事情的发展","坚定的价值观和使命感，不会被外力轻易动摇","善于激励和帮助他人成长，是出色的导师和陪伴者","创造力强，能将抽象理念转化为具体的文字和行动","对人际关系有极高的敏感度，能精准感知他人情绪","拥有将复杂问题提炼为核心洞见的罕见能力","兼具理想主义的远见和务实主义的执行力"],"weaknesses":["容易过度投入而耗尽自己，忽视自我保护","对批评和冲突异常敏感，负面反馈可能久久难以消化","过度追求完美可能导致行动迟缓或决策瘫痪","难以向他人敞开心扉寻求支持，习惯独自承受","有时过于理想化而忽视现实限制和可行性","对不真诚和虚伪极度敏感，容易对世界失望","可能过度解读他人的言行，陷入没有根据的焦虑"],"careers":[{"title":"心理咨询师/治疗师","reason":"天生善于理解他人内心世界并引导疗愈"},{"title":"作家/编剧","reason":"能将深刻的洞见转化为动人的故事"},{"title":"教育工作者","reason":"热衷于帮助他人成长和发展潜力"},{"title":"非营利组织负责人","reason":"使命驱动且富有同理心和领导力"},{"title":"HR/人力资源总监","reason":"善于发现人才和理解人的深层需求"},{"title":"UX设计师","reason":"能够深入理解用户的情感需求和体验"},{"title":"精神科医生","reason":"对人的心理有超乎寻常的洞察"},{"title":"外交官/调解人","reason":"善于理解多方立场并寻找共赢方案"}],"relationships":"INFJ 在关系中寻求深度和真实性，不满足于浅层的社交互动。他们渴望与伴侣建立灵魂层面的连接——那种无需多言就能相互理解的心灵默契。INFJ 用极高的标准选择朋友和伴侣，宁缺毋滥是他们的关系准则。但一旦建立信任，会毫无保留地投入全部的热情和关怀。\n\nINFJ 在亲密关系中需要警惕的是：不要将理想化的期待投射到对方身上，学会接受人性的不完美和局限性。他们也容易在关系中过度付出而忘记设立边界，最终感到被掏空。健康的 INFJ 关系是两个独立而完整的灵魂相互滋养，而非一个人倾尽所有去拯救另一个人。学会表达自己的需求，允许对方承接自己脆弱的一面，是 INFJ 走向真正亲密的关键一步。","development":"1. 学会设立清晰的情感边界，保护自己的能量不被过度消耗\n2. 接受自己不完美的一面，减少不必要的自我苛责\n3. 练习直接表达需求和脆弱，而非期待他人主动洞察\n4. 将宏大的理想分解为可执行的具体步骤\n5. 允许自己偶尔放下使命感，单纯享受当下的生活\n6. 培养一个纯粹为快乐而存在的爱好，不带任何目的感\n7. 学习区分“我的问题”和“他人的问题”，不过度承担责任","figures":["马丁·路德·金","纳尔逊·曼德拉","特蕾莎修女","列夫·托尔斯泰","C·S·刘易斯","卡尔·荣格","圣雄甘地"]},
  "INFP":{"type":"INFP","name":"调停者","features":["理想主义","富有同理心","创造力强","忠实于价值观","善于共情","内心丰富","真诚温暖"],"desc":"INFP 是行走在世间的诗人和梦想家，约占人口 4%。他们内心世界丰盈而细腻，用近乎艺术家般的感知力体会着生命中的每一丝微妙情感。INFP 被强烈的内在价值观所驱动，对美、真理和善意有着近乎执拗的追求——他们不是不知道世界的黑暗，而是选择成为照亮黑暗的那束光。\n\nINFP 能够轻易地站在他人立场感受世界，这种天赋的同理心使他们成为出色的倾听者和安慰者。在外界看来，INFP 也许不够务实或过于敏感，但正是这份敏感成就了他们独特的创造力和深度。他们是那种会被一首诗感动落泪、为一个陌生人的故事心痛、并决心要用自己的方式让世界温暖一点点的人。","strengths":["极强的情感理解和共情能力，是天生的人际温度计","深厚的创造力和艺术天赋，能将情感转化为各种形式的作品","坚定的个人价值观和原则，不会为利益出卖灵魂","善于倾听和提供情感支持，朋友们的安全港湾","能够看到每个人和事物的潜力，而非仅看到现状","拥有丰富的内在世界，从不感到真正的无聊","对多元价值和文化有天然的包容和欣赏"],"weaknesses":["容易沉浸在自己的理想世界，与现实脱节","面对现实压力时容易退缩或逃避","过度内省可能滑向消极情绪和自我怀疑","难以接受批评和负面反馈，会放大每一个瑕疵","有时因为追求理想而忽视现实生活的实际需求","不善于处理冲突，可能以牺牲自我来换和平","在做实际决策时容易犹豫不决，反复权衡"],"careers":[{"title":"作家/诗人","reason":"拥有丰富的内心世界和独特的文字表达力"},{"title":"心理咨询师","reason":"天生的倾听者和情感理解者"},{"title":"艺术家/插画家","reason":"独特的审美视角和创造性表达"},{"title":"社工/公益工作者","reason":"由强烈的价值观和同理心驱动"},{"title":"教师/教育者","reason":"善于发现每个学生的独特潜力"},{"title":"音乐家/作曲家","reason":"能将深邃情感转化为动人的旋律"},{"title":"图书编辑","reason":"对文字和故事有天然的鉴赏力"},{"title":"兽医/动物保护","reason":"对生命无差别的温柔关怀"}],"relationships":"INFP 在关系中浪漫而投入，他们寻找的是灵魂伴侣而非普通伴侣，渴望一种超越日常的深刻连接。INFP 会用心去理解和接纳伴侣的全部——包括那些不完美的、脆弱的、甚至自己都不愿面对的部分。他们表达爱的方式是细腻而含蓄的：一首手写的诗、一段突然分享的音乐、一个用心准备的惊喜。\n\nINFP 在关系中最大的挑战是学会保持真实的自我，而不是为了关系的和谐而不断牺牲自己的需求和边界。他们有时会因为害怕冲突而压抑真实的想法，直到某一天内爆。健康的 INFP 关系是：在给予爱的同时不失去自己，在追求理想时不否定现实，在温柔中拥有坚定的内核。要学会相信：表达真实的需求不会推开真正爱你的人。","development":"1. 培养面对现实挑战的韧性和行动力，从一小步开始\n2. 学会以更积极和建设性的方式处理负面情绪\n3. 练习将理想付诸具体、可操作的计划，而非停留在憧憬\n4. 建立健康的情感边界，不过度吸收他人的情绪和痛苦\n5. 接受世界的复杂性，包括它不如理想中完美的部分\n6. 主动寻求反馈并练习以成长心态面对批评\n7. 每天做一件微小但实在的事，积累“行动者”的身份认同","figures":["J·R·R·托尔金","约翰·列侬","威廉·莎士比亚","村上春树","奥黛丽·赫本","文森特·梵高","安托万·德·圣-埃克苏佩里"]},
  "ENFJ":{"type":"ENFJ","name":"主人公","features":["富有魅力","善于鼓舞","热心助人","组织能力强","直觉敏锐","情感细腻","无私奉献"],"desc":"ENFJ 是天生的教育者和激励者，约占人口 2-3%。他们拥有超凡的社交直觉，能精准地感知他人需求并将其引导至最佳方向。ENFJ 相信每个人都有无限的潜力，并将帮助他人实现这种潜力视为自己的使命——他们是那种在你最低谷时会用温暖而坚定的声音告诉你“你可以的”的人。\n\nENFJ 的热情和真诚具有强大的感染力，能够将周围的人凝聚在一起朝共同目标前进。在人群中，ENFJ 往往是那个被大家信赖和依靠的核心人物。他们不仅能看到你的现状，更能看到那个你尚未成为的更好的自己，并用耐心和智慧帮你一步步走近。但这种光芒也意味着责任——ENFJ 常常承载着太多人的期待和情感，如果不学会自我保护，容易在照亮他人的同时耗尽自己。","strengths":["出色的沟通和激励能力，能点燃他人的内在动力","强大的人际关系直觉，精准感知氛围和情绪流动","善于组织和带领团队，能将多元个体凝聚成整体","真诚关心他人并乐于付诸实际行动帮助","能够在混乱中找到方向并以身作则带领大家前进","拥有将抽象愿景转化为具体行动的超凡能力","包容而有耐心，能以对方需要的节奏陪伴成长"],"weaknesses":["可能过度介入他人问题而忽略自身需求和健康","难以拒绝求助，容易在无止境的付出中过度消耗","对批评和负面评价较为敏感，容易自我怀疑","有时过于理想化而忽视现实困难和资源限制","在决策时可能过度考虑他人感受而拖延","可能无意识地操纵他人走向自己认为“正确”的方向","在自己需要帮助时却难以开口，陷入孤独"],"careers":[{"title":"企业管理者/HR总监","reason":"善于发现和培养人才，营造积极文化"},{"title":"教师/教育者","reason":"热爱帮助他人成长和发现潜能"},{"title":"销售/公关总监","reason":"出色的沟通和建立深层关系的能力"},{"title":"政治家/社会活动家","reason":"使命感强且富有领导魅力"},{"title":"人生教练/培训师","reason":"善于激励他人突破自我完成目标"},{"title":"演讲家/作家","reason":"能够用语言和文字感染和打动人心"},{"title":"心理咨询师","reason":"深度的共情能力和引导天赋"},{"title":"非营利机构负责人","reason":"使命驱动且善于动员社会力量"}],"relationships":"ENFJ 在关系中是典型的付出者和守护者。他们会用心记住伴侣的每一个细节和喜好，并不断创造让关系升温的美好体验——精心策划的约会、富有深度的对话、在最需要时恰好出现的支持。ENFJ 追求深度和真实性，厌恶浅薄和虚伪的关系。\n\n他们在关系中的挑战是：不要把所有责任都扛在自己身上，也要学会接受伴侣的照顾和支持。ENFJ 有时会不自觉地扮演“拯救者”角色，将伴侣的成长视为自己的责任，这可能导致关系的不平等。健康的 ENFJ 关系是双向滋养的：你给予光和热，但也允许自己偶尔成为那个被照亮的人。学会相信伴侣有能力处理自己的问题，不需要你每时每刻都在场。","development":"1. 学会说“不”，设定合理的个人边界，这不是自私\n2. 接受并非所有人都需要或想要被帮助，尊重他人的节奏\n3. 将关注他人的时间和精力留一部分给自己\n4. 学会接受批评，将其视为成长机会而非否定\n5. 练习在独处中获得能量，而非完全依赖社交反馈\n6. 定期检查自己的能量值，在耗尽前主动休息\n7. 培养一个完全属于自己的爱好，不服务于任何人","figures":["巴拉克·奥巴马","奥普拉·温弗瑞","马丁·路德·金","约翰·麦凯恩","詹妮弗·洛佩兹","尼尔·帕特里克·哈里斯","玛雅·安吉罗"]},
  "ENFP":{"type":"ENFP","name":"竞选者","features":["热情洋溢","极富创意","善于交际","乐观积极","自由奔放","情感丰富","灵活多变"],"desc":"ENFP 是人群中的开心果和灵感源泉，约占人口 7%。他们以孩子般的好奇心和热情拥抱世界，总能从平凡中发现不平凡的可能。ENFP 对人和生活有着永不枯竭的兴趣，能够与几乎任何人找到共同话题并建立温暖的连接。\n\n他们的思维跳跃而发散，常常在看似无关的事物之间建立起令人惊叹的联系。ENFP 天生具有点燃他人热情的能力，是绝佳的氛围营造者和创意推动者。和他们在一起，你会觉得一切皆有可能。但 ENFP 也有另一面：在热闹散去、人群散场之后，他们需要面对那个深沉的、思考生命意义的自己。社交是他们的能量来源，但偶尔也会成为他们逃避深层思考和困难的出口。","strengths":["极强的社交能力和适应性，到哪里都能找到朋友","丰富的想象力和创造力，点子源源不断","能够鼓舞和激励他人，天生的团队催化剂","对新事物保持开放和好奇，永不停止探索","善于发现他人的优点和潜力，并能真诚赞美","能够在高压社交环境中游刃有余地调节氛围","对多元价值和不同生活方式有天然的包容"],"weaknesses":["容易分心，难以长时间专注单一任务","过度乐观可能低估实际困难和风险","不擅长处理细节和行政事务，需要结构性支援","有时过于情绪化和敏感，情绪波动较大","容易感到被困在常规和限制中，产生逃离冲动","可能在多个选择之间反复横跳，难以做出最终决定","对长期承诺可能感到压力，需要空间和自由"],"careers":[{"title":"记者/主持人","reason":"热爱与人交流且表达能力强"},{"title":"创意总监/策划","reason":"丰富的想象力和跨界创新思维"},{"title":"心理咨询师/社工","reason":"善于理解和支持他人的独特旅程"},{"title":"演员/表演者","reason":"喜欢成为焦点且富有表现力"},{"title":"销售/业务拓展","reason":"出色的沟通和建立深厚关系的能力"},{"title":"自由职业者/数字游民","reason":"享受自由和多样化的工作方式"},{"title":"旅行博主/作家","reason":"热爱探索和分享新鲜体验"},{"title":"活动策划师","reason":"能把任何聚会变成难忘的体验"}],"relationships":"ENFP 在关系中充满热情和浪漫，他们会用各种创意方式让对方感受到被爱和被珍惜——惊喜旅行、深夜长谈、手写信件、突如其来的礼物。ENFP 需要的是一个能跟上他们跳跃思维、理解他们对自由和新奇需求的人。\n\nENFP 在关系中最大的挑战是：学会在热情之外也投入持续的专注和承诺，避免因为新鲜感消退而产生动摇。他们可能在新关系的蜜月期投入全部热情，但当日常的平淡到来时需要学会从中发现同样深刻的连接。真正的成长是意识到：真正的爱不是永远新鲜刺激，而是在千百个普通日子中依然选择那个人。ENFP 需要学习的，是区分“无聊”和“平静”，后者可能才是长久幸福的基础。","development":"1. 培养时间管理和专注力，选择一个核心项目坚持到底\n2. 学习处理细节和执行层面的事务，或找互补的伙伴\n3. 在社交投入和独处充电之间找到健康的平衡\n4. 练习将冲动转化为更有计划的行动\n5. 面对困难时坚持到底，而非转向新的新鲜方向\n6. 定期进行深度反思，总结情绪和行动的模式\n7. 学会对不重要的事说“不”，保护自己的精力和时间","figures":["罗宾·威廉姆斯","马克·吐温","威利·纳尔逊","艾伦·德詹尼丝","小罗伯特·唐尼","奥斯卡·王尔德","安妮·弗兰克"]},
  "ISTJ":{"type":"ISTJ","name":"物流师","features":["可靠务实","严谨细致","责任心强","逻辑清晰","遵守规则","坚韧不拔","有条不紊"],"desc":"ISTJ 是社会运转的中流砥柱，约占人口 11-13%。他们严谨、务实、可靠，像精准的时钟一样确保每一个承诺都能兑现，每一个细节都不被遗漏。ISTJ 尊重事实和逻辑，崇尚秩序和规则，不轻易被情绪或潮流所动摇。他们也许不是最耀眼的人，但绝对是那个在关键时刻可以放心托付一切的人。\n\nISTJ 的价值常常在日常的稳定输出中被低估——他们不会大声宣扬自己的成就，不会抢占聚光灯，但任何组织的长期运转都离不开他们的默默坚守。他们是那种会订好闹钟、提前五分钟到达、做好充分准备、把每件事都做到位的人。在一个追求“快”和“新”的时代，ISTJ 提醒我们“稳”和“准”的珍贵。","strengths":["高度可靠，承诺必达，是可以托付后背的人","严谨细致，注重质量和准确性，几乎不出错","组织能力强，善于建立和维护高效的系统与秩序","逻辑清晰，决策客观，不受情绪干扰","耐心和毅力出众，能长期坚持枯燥但必要的工作","尊重事实和数据，在信息泛滥的时代保持清醒","拥有强大的自我管理能力，不需要外部督促"],"weaknesses":["可能过于固执和教条，难以接受新的做事方法","对变化和不确定性感到严重不适，需要预测和计划","不善于表达情感和温暖，可能被误解为冷漠","有时过于关注细节而忽略全局和战略趋势","对新观念和新技术接受较慢，可能落后于时代","过度工作可能导致忽视个人生活和健康","在需要即兴发挥和灵活应变的场合可能紧张"],"careers":[{"title":"会计师/审计师","reason":"天生的严谨和对细节的绝对把控"},{"title":"军人/警察","reason":"纪律性强且忠于职责和使命"},{"title":"法官/法律工作者","reason":"公正客观且对规则有深刻尊重"},{"title":"质量控制经理","reason":"对标准和流程有近乎苛刻的要求"},{"title":"数据分析师","reason":"实事求是且耐心处理海量信息"},{"title":"行政管理者","reason":"善于维持秩序和确保高效运转"},{"title":"项目管理师","reason":"严密的计划能力和交付意识"},{"title":"外科医生","reason":"精准、冷静、可靠的手术执行者"}],"relationships":"ISTJ 用行动而非言语来表达关心。他们会通过准时赴约、履行每一个承诺、默默解决实际问题来表达对伴侣和家人的爱——他们的爱是有形的、可触摸的、不容置疑的。ISTJ 珍视稳定和忠诚，一旦承诺就是一辈子的事。\n\n他们的挑战是在关系中学会用更多语言和情感层面的方式表达爱，理解并非所有人都以相同的“频道”接收和感受关心。ISTJ 可能觉得“我已经帮你修好了车”就是最直接的爱，但伴侣可能需要的是“你今天过得怎么样”这样的情感对话。学会偶尔跳出务实模式，尝试用言语、拥抱和专注的陪伴来传递感情，能让 ISTJ 的关系更加丰润。","development":"1. 尝试以更开放的心态接受新的方法和观念，先从小的开始\n2. 练习用语言和肢体接触表达情感，哪怕只是每天一句“辛苦了”\n3. 偶尔跳出舒适区和计划表，体验计划之外的美好\n4. 学会从宏观和战略角度看待问题，而非仅仅聚焦操作细节\n5. 培养对他人情感状态的觉察和回应的能力\n6. 定期反思自己的习惯和假设是否还适应当前环境\n7. 为自己安排完全放松和享乐的时间，不带有任何目的","figures":["沃伦·巴菲特","乔治·华盛顿","安吉拉·默克尔","杰夫·贝佐斯","娜塔莉·波特曼","伊丽莎白女王二世","德怀特·艾森豪威尔"]},
  "ISFJ":{"type":"ISFJ","name":"守卫者","features":["温柔体贴","忠诚可靠","勤奋细心","善于照顾","默默奉献","责任感强","务实温暖"],"desc":"ISFJ 是世界上默默守护他人的温暖力量，约占人口 13%。他们温和而坚定，用细腻的关怀和不知疲倦的实际行动让身边的人感受到被保护和被珍视。ISFJ 有着超强的记忆力和观察力，能够记住每个在乎之人的生日、喜好、说过的话——不是刻意记录，而是因为他们真正在乎。\n\n他们不求回报地付出，在习惯了快节奏和功利计算的现代社会中，ISFJ 提醒我们什么是真正的善良和体贴。他们是那个在你生病时送来热汤的人，在你加班时默默帮你订好晚餐的人，在你崩溃时安静坐在你旁边的人。ISFJ 的温暖是低调而持久的，像冬日里的暖手宝，不会烫手，但能让你感到从头到脚的安心。","strengths":["极强的共情和照顾能力，能精准感知他人需求","忠诚可靠，一旦承诺会坚持到底，不会半途放弃","细致入微，善于观察和记忆，不遗漏重要细节","脚踏实地，执行力强，不需要监督就能高质量完成","温和善良，善于营造温暖、安全、舒适的氛围","高度负责，对自己的工作和人际关系有强烈的责任心","传统手艺和实用技能的出色继承者和实践者"],"weaknesses":["容易忽视自己的需求和感受，长期透支可能突然崩溃","不善于拒绝他人，可能在无声中累积怨恨","对变化和不确定性适应较慢，需要足够的准备时间","在面对冲突时容易回避或压抑，问题可能因此积累","可能过于谦逊而错过展示自己能力和争取机会的时机","过于关注他人的评价和认可，容易焦虑","可能对新潮流和技术变革持保守态度而落后"],"careers":[{"title":"护士/医生","reason":"天生善于照顾他人且细致认真，患者信赖"},{"title":"教师/幼教","reason":"温柔耐心，善于引导和关怀每一个孩子"},{"title":"社工/心理咨询师","reason":"富有同理心且擅长无声的陪伴和倾听"},{"title":"行政/秘书","reason":"可靠细致且忠诚度高，是老板最信任的人"},{"title":"图书管理员/档案员","reason":"喜欢有序环境且服务意识强"},{"title":"私人管家/家庭助理","reason":"善于营造舒适温暖的生活空间"},{"title":"手工艺人/烘焙师","reason":"将细腻和温暖融入每一个作品"},{"title":"医疗助理","reason":"结合照顾能力和务实精神"}],"relationships":"ISFJ 在关系中是典型的付出者和守护者。他们会通过记住每一个重要日期、准备贴心的礼物、默默处理好所有生活琐事来表达爱意。对 ISFJ 而言，爱不是轰轰烈烈的宣告，而是日复一日的在场和照顾——早上那杯刚好温度的咖啡、衣柜里叠得整整齐齐的衣服、冰箱里永远储备着你喜欢的食物。\n\n他们需要学习的是：也要允许自己接受照顾，不要把所有压力都默默承担。ISFJ 有时会在关系中感到委屈，因为付出了太多却得不到同等回馈——但他们忘了，自己从未开口说过需要什么。学会表达需求不是软弱，而是对关系的一种信任。真正的双向关系是：你也值得被照顾。","development":"1. 学会表达自己的需求和感受，给他人在乎你的机会\n2. 练习说“不”，保护自己的时间和能量不是自私\n3. 尝试接受和适应变化，将其视为成长的机会而非威胁\n4. 在照顾他人的同时留出固定的自我关爱时间\n5. 增强自信，相信自己的能力值得被看见和认可\n6. 学习在冲突中勇敢表达不同意见，而非默默妥协\n7. 记录和庆祝自己的成就，而非只关注他人是否满意","figures":["特蕾莎修女","碧昂丝·诺尔斯","凯特·米德尔顿","安妮·海瑟薇","克里斯·帕拉特","哈莉·贝瑞","罗莎·帕克斯"]},
  "ESTJ":{"type":"ESTJ","name":"总经理","features":["高效务实","果断决策","组织能力强","坚守原则","责任感强","指挥若定","公正严明"],"desc":"ESTJ 是天生的管理者和执行者，约占人口 8-10%。他们拥有出色的组织能力和领导才能，能够将混乱变为秩序，将计划变为成果。ESTJ 尊重传统和规则，相信好的制度是高效运转的基础——他们深知，没有纪律的自由只是混乱。\n\n他们直言不讳，不拐弯抹角，在推动事物前进时展现出令人敬畏的执行力。ESTJ 不追求抽象的哲学思考，他们更关心“这件事如何做”以及“如何做得更好”。在 ESTJ 的世界里，一切都有其正确的位置和流程，他们就是那个确保齿轮精准咬合的人。如果你需要一个人把事情搞定——干净、利落、不出差错——找 ESTJ。","strengths":["卓越的组织和管理能力，能将混乱改造为高效系统","决策果断，执行力强，不拖泥带水","诚实直率，话说在明处，值得信任","高度负责，从不推卸责任或找借口","善于建立和维护高效的秩序和工作流程","在压力下保持冷静和高效运作","尊重规则和层级，确保组织平稳运转"],"weaknesses":["可能过于强硬和缺乏灵活性，听不进不同意见","对他人情感需求不够敏感，被认为冷酷无情","难以接受不同的观点和做事方式","不善于处理模糊和抽象的情境，可能焦虑","有时过于关注效率和结果而忽视了人","可能把“正确”置于“感受”之上，伤害团队凝聚力","在需要创新和打破常规的场合可能束手束脚"],"careers":[{"title":"公司管理者/COO","reason":"卓越的组织和执行能力"},{"title":"法官/执法人员","reason":"坚守规则且公正不阿"},{"title":"军事指挥官","reason":"决策果断且纪律严明"},{"title":"项目管理者","reason":"善于推动复杂项目按时按质交付"},{"title":"财务主管","reason":"务实严谨且组织能力强"},{"title":"教育管理者","reason":"善于建立和维护教育体系"},{"title":"政府官员","reason":"尊重规章制度且执行力强"},{"title":"供应链经理","reason":"对流程优化和效率有极致追求"}],"relationships":"ESTJ 在关系中负责而可靠，他们会通过履行承诺和稳定支持来表达对伴侣的重视。ESTJ 期望关系像事业一样有序运行，有明确的责任分工和相互尊重。他们可能不会每天说“我爱你”，但会在你需要帮助时第一个站出来，用实际行动证明一切。\n\n他们的挑战是：理解伴侣可能需要更多的情感交流和柔软的表达方式，学会在掌控和包容之间找到平衡。ESTJ 有时会不自觉地像管理团队一样管理家庭关系，这可能导致伴侣感到压力和疏远。学习在关系中放下管理者的身份，允许自己和对方偶尔的放松和不完美，是 ESTJ 情感成熟的标志。","development":"1. 练习倾听和真正考虑不同的意见和方法\n2. 培养对他人情感的觉察和温柔回应的能力\n3. 偶尔放下效率追求，享受当下和过程中的美好\n4. 学会接受不确定性和模糊状态，这是创新的土壤\n5. 在坚持原则的同时保持一定的弹性和人情味\n6. 主动了解和学习他人的感受，用语言表达关心\n7. 为自己安排没有目标和产出的时间，纯粹放松","figures":["撒切尔夫人","约翰·D·洛克菲勒","弗兰克·辛纳屈","米歇尔·奥巴马","汤姆·克鲁斯","乔治·W·布什","艾玛·沃特森"]},
  "ESFJ":{"type":"ESFJ","name":"执政官","features":["热心周到","善于社交","责任感强","注重和谐","乐于助人","温暖有爱","细致入微"],"desc":"ESFJ 是温暖而可靠的社会粘合剂，约占人口 12%。他们天生在意他人的感受和需求，善于营造和谐融洽的氛围。ESFJ 有着超强的社交雷达，能准确察觉谁需要帮助，并以实际的行动提供支持——他们不是问“你需要帮忙吗”，而是已经帮完才告诉你。\n\n他们珍视传统和社区，喜欢参与和筹办集体活动，是朋友圈和工作团队中最受欢迎的那类人。ESFJ 也许不是最有创意的类型，但绝对是那个让每个人感到被看见和被关心的人。在 ESFJ 的身边，你会知道：有人在意你的生日、有人记得你喜欢吃什么、有人会在你难过时带着温暖的汤和倾听的耳朵出现。","strengths":["极强的社交能力和亲和力，到哪里都是大家的太阳","真诚关心他人且乐于以实际行动帮助","组织能力强，善于协调复杂的人事和活动","忠诚可靠，对承诺和责任看得很重","善于营造温暖和谐的团队氛围，提升团队士气","拥有惊人的细节记忆，尤其是关于人的偏好和需求","在危机中能快速组织人力并提供情感支持"],"weaknesses":["过度在意他人看法和评价，可能活在别人的期待中","难以接受批评和冲突，内心容易受伤","可能忽视自身需求，长期付出导致枯竭","不善于处理抽象的理论性问题，偏好具体事务","可能过于循规蹈矩而缺乏创新和突破","在需要独立思考和坚持己见时可能摇摆","对他人的负面情绪过于敏感，容易共情过度"],"careers":[{"title":"护士/护理师","reason":"真诚关心他人且有组织能力和耐心"},{"title":"教师/教育工作者","reason":"善于与人沟通和建立温暖的学习环境"},{"title":"HR/人事专员","reason":"擅长理解人的需求和协调人际关系"},{"title":"活动策划师","reason":"喜欢组织活动且注重每一个细节"},{"title":"客服/客户成功经理","reason":"亲和力强且服务意识发自内心"},{"title":"社区工作者","reason":"热心于服务他人和社区建设"},{"title":"公关/品牌大使","reason":"温暖真诚的形象天然适合代表品牌"},{"title":"婚庆策划","reason":"用温暖和细致为他人创造最重要的纪念日"}],"relationships":"ESFJ 在关系中全心全意地投入。他们会主动记住生日、纪念日和各种细节，用心维护关系的温度和仪式感。对 ESFJ 来说，关系是需要用心经营的花园，他们会每天浇水、施肥、修剪——并且希望看到花开。\n\nESFJ 期望获得同等程度的关心和回馈，如果感到被忽视或付出不对等，内心会受到很深的伤害。他们需要学习的课题是：不要将自我价值完全建立在关系和他人的认可之上。真正的安全感来自内在，而非外界的掌声。健康的关系不是你不间断地付出然后期待回报，而是两个完整的人自然地相互滋养。","development":"1. 学会不过度依赖外界的认可和反馈来确认自我价值\n2. 尝试独立思考和做出属于自己的选择\n3. 接受适度的冲突和分歧是健康关系的正常组成部分\n4. 留一些时间和空间给自己，发展不服务他人的个人兴趣\n5. 在关注他人的同时，优先关照自己的身心健康\n6. 学习在关系中平等表达，不总是扮演给予者\n7. 练习接纳不同的生活方式和选择，不投射自己的标准","figures":["泰勒·斯威夫特","比尔·克林顿","詹妮弗·加纳","艾丽·肯珀","史蒂夫·哈维","莫妮卡·盖勒","玛丽亚·凯莉"]},
  "ISTP":{"type":"ISTP","name":"鉴赏家","features":["冷静务实","动手能力强","灵活应变","独立自主","善于分析","行动迅速","低调沉稳"],"desc":"ISTP 是冷静而灵巧的实践者，约占人口 5%。他们对世界如何运作有着直观而深刻的理解，喜欢拆解、修理、优化一切可以动手操作的事物。ISTP 不迷恋理论——动手试试看，不行就换个方法再来——这就是他们的人生哲学。\n\n他们天生冷静，在危机中反而更加专注和高效。当其他人还在惊慌失措时，ISTP 已经在脑中构建出了完整的应对方案并开始执行。他们倾向于保持低调和独立，不寻求关注，不喜欢成为焦点，但总能在最需要的时候以精湛的技术和冷静的大脑化解难题。ISTP 是那种如果你被困在荒岛上最希望同行的人——他们可能话不多，但能徒手造一艘船带你回家。","strengths":["出色的实操和技术能力，几乎能上手任何工具","冷静理智，在危机和高压力环境中表现格外优异","灵活应变，不拘泥于单一方案，善于即兴发挥","独立自主，不需要外部监督和管理就能出色完成任务","快速学习和适应新工具、新技术、新环境","精准的问题诊断能力，能快速锁定症结所在","脚踏实地，从不空谈，只关注实际可行的方案"],"weaknesses":["不善于表达情感和建立深层的言语连接","可能显得冷漠和疏离，让他人感到难以靠近","对长期规划和抽象目标缺乏兴趣和耐心","不擅长处理情感类人际关系问题，倾向于回避","可能回避承诺和长期绑定，珍视自由和独立","在需要大量交流和协作的团队中可能格格不入","有时过于沉溺于个人技术世界而忽视更大的图景"],"careers":[{"title":"工程师/技师","reason":"天生的动手能力和技术直觉"},{"title":"飞行员/驾驶员","reason":"冷静且善于应对突发状况"},{"title":"外科医生","reason":"手巧心稳且能在压力下保持专注"},{"title":"程序员/黑客","reason":"喜欢解谜和动手解决问题"},{"title":"法医/刑侦","reason":"客观冷静且注重线索细节"},{"title":"户外探险家/搜救员","reason":"享受独立解决实际问题的挑战"},{"title":"机械师","reason":"对任何机械系统都有自己的直觉理解"},{"title":"消防员/急救员","reason":"在极端危险中保持冷静高效的典范"}],"relationships":"ISTP 在关系中低调而务实。他们不擅长华丽的言辞和浪漫的表达，但会用行动解决问题和保护在乎的人——你的电脑坏了，他们默默修好；你的车出问题了，他们已经帮你约了维修。ISTP 的爱是有效率的、可依赖的。\n\n他们尊重伴侣的独立空间，也强烈期望对方同样尊重他们的。ISTP 的独处时间不是冷落，而是他们恢复能量和保持自我的方式。他们在关系中最需要成长的课题是：亲密关系除了“解决问题”的维度，还有“情感陪伴”的维度——有时候伴侣需要的不是解决方案，而是你在那里。","development":"1. 练习用言语表达情感和关心，哪怕只是简单的“我在乎你”\n2. 尝试参与需要团队深度合作的活动，锻炼协作沟通\n3. 对长期规划和未来目标投入更多思考和规划时间\n4. 在面对情感问题时不要只用逻辑去分析，尝试感受\n5. 主动在关系中分享自己的内心世界和感受\n6. 学会在关系中给予更多情感层面的在场和陪伴\n7. 培养一个需要与他人分享和交流的兴趣，打破孤独循环","figures":["李小龙","克林特·伊斯特伍德","汤姆·克鲁斯","迈尔斯·戴维斯","迈克尔·乔丹","哈里森·福特","布鲁斯·威利斯"]},
  "ISFP":{"type":"ISFP","name":"探险家","features":["温柔敏感","艺术天赋","随和灵活","活在当下","真诚真实","审美独到","安静深邃"],"desc":"ISFP 是行走在人间的艺术灵魂，约占人口 8-9%。他们对美有着天然的敏感，能够从最平凡的生活片段中发现诗意和灵感——清晨的一缕阳光、咖啡杯上映出的倒影、街角陌生人的一个微笑，都能触动他们内心最深处的琴弦。\n\nISFP 温和而低调，不喜欢冲突和争吵，宁愿用行动而非言语来表达自己的立场。他们活在当下的每一个真切时刻里，珍惜每一个真实的感官体验。ISFP 不善于用语言解释自己，但他们的作品——无论是画布上的色彩、照片中的光影还是精心烹制的料理——都在无声地述说着一个丰富而深邃的内心世界。和他们在一起，你会不自觉地放慢脚步，开始注意到生活中那些被匆忙忽略的美。","strengths":["敏锐的审美和艺术天赋，对美有天生的直觉","温和友善，容易相处，让人感到安全和舒适","灵活适应，不固守规则，随遇而安","真诚真实，不虚伪做作，让人感到纯粹","对美和细节有独特的感知力，能发现别人忽略的东西","强大的实践能力，能将创意转化为具体作品","对他人有自然的接纳和包容，不轻易评判"],"weaknesses":["不善于长期规划和预测未来，可能被动应对","回避冲突，可能压抑真实想法而导致内伤","对批评和负面评价非常敏感，容易自我否定","可能过度沉浸在自己的内心和创作世界","不擅长处理抽象的理论和复杂的系统","在需要坚定表达立场和决策时可能犹豫","对现实世界的竞争和功利化可能感到不适和逃避"],"careers":[{"title":"设计师(平面/室内/服装)","reason":"天生的审美和创造力"},{"title":"摄影师","reason":"对光影和瞬间有独特捕捉力"},{"title":"音乐家/作曲家","reason":"能将情感转化为动人的艺术表达"},{"title":"花艺师/厨师","reason":"善于用手创造触手可及的美好体验"},{"title":"心理咨询师","reason":"温和的倾听和深度的共情能力"},{"title":"兽医/动物保护","reason":"对生命温柔的关怀和尊重"},{"title":"按摩师/身体治疗师","reason":"对触觉和身体感受有细腻的理解"},{"title":"画廊策展人","reason":"独到的艺术眼光和审美判断"}],"relationships":"ISFP 在关系中温柔而真诚。他们用细致入微的关怀和共创美好体验来表达爱意——精心准备的晚餐、共同聆听的音乐、一起走过的风景。对 ISFP 而言，爱不是被说出来而是被体验到的。\n\nISFP 重视关系中的和谐与舒适，但需要学习的是：亲密关系也需要适度的冲突和坦诚来促进真正的理解。害怕冲突而不断妥协，最终可能失去真实的自己。健康的 ISFP 关系是：在温柔中保有自己的边界，在和谐中不忘表达真实的声音。不完美的交流胜过完美的沉默。","development":"1. 学会表达不同意见和真实感受，冲突也可以是建设性的\n2. 尝试制定简单的长期规划并坚持执行，看到时间的力量\n3. 接受适度的冲突是关系中的正常部分\n4. 培养对抽象概念和理论的理解能力，拓展视野\n5. 在展示才华时不要过于谦虚，世界需要你的光芒\n6. 建立基本的生活结构和时间管理习惯\n7. 学习用语言沟通情感需求，而非只依赖行动和氛围","figures":["鲍勃·迪伦","迈克尔·杰克逊","艾薇儿·拉维尼","弗里达·卡罗","瑞恩·高斯林","大卫·贝克汉姆","布兰妮·斯皮尔斯"]},
  "ESTP":{"type":"ESTP","name":"企业家","features":["行动力强","善于应变","冒险精神","机智幽默","务实果敢","魅力十足","反应迅速"],"desc":"ESTP 是活在行动中的冒险家，约占人口 4-5%。他们以大无畏的勇气和对生活的热忱冲向每一个机会和挑战——因为想太多只会耽误最佳时机，不如先做了再说。ESTP 拥有超凡的临场反应能力，总能在千钧一发之际找到出路。\n\n他们务实而敏锐，能快速评估局势和风险，在商业和社交中都游刃有余。ESTP 是那种让生活变得更有趣、更刺激的人——当然，有时也太刺激了一点。他们身上有一种让人无法抗拒的磁场：当你和他们在一起，你会觉得什么事都能做成，什么困难都能跨过，什么冒险都值得一试。","strengths":["极强的行动力和应变能力，说干就干从不犹豫","务实冷静，能快速感知机会和风险","社交能力强，感染力十足，到哪里都是焦点","在压力下能快速做出正确决策","学习新技能和适应新环境速度惊人","出色的谈判和说服能力，天生的交易高手","在混乱和危机中是天然的稳定锚和指挥者"],"weaknesses":["可能过于冲动和冒险，不对后果做充分评估","对长期规划和战略耐心缺乏兴趣","不善于处理细腻的情感和深度心理问题","可能忽视规则和他人的感受和边界","对理论和抽象思考缺乏耐心","容易被新鲜刺激吸引而半途而废","在需要沉淀和深度思考时可能感到焦躁不安"],"careers":[{"title":"企业家/创业者","reason":"敢于冒险且执行力强"},{"title":"销售/经纪人","reason":"社交能力强且善于抓住每一个机会"},{"title":"急救/消防员","reason":"临危不乱且行动迅速"},{"title":"投资/交易员","reason":"善于判断局势并在瞬息间做决策"},{"title":"运动员/教练","reason":"天生的身体协调性和永不言败的竞争意识"},{"title":"侦探/调查员","reason":"敏锐的观察力和务实的推理思维"},{"title":"特技演员","reason":"对肾上腺素和挑战极限有天然的渴望"},{"title":"谈判专家","reason":"在高压和变数中保持冷静和说服力"}],"relationships":"ESTP 在关系中充满乐趣和惊喜。他们用行动和体验来创造浪漫——突然的旅行、刺激的冒险、意想不到的礼物和大胆的告白。与 ESTP 在一起永远不会无聊。\n\n但长久的关系除了火花还需要耐心、深度沟通和持续的安全感。ESTP 可能因为追求刺激而忽视伴侣对稳定和承诺的需求。他们需要学习的课题是：真正的亲密不是持续的高能体验，而是在激情褪去后依然选择留在彼此身边。学会在平静中发现深度，在稳定中找到自由。","development":"1. 学习制定和执行长期计划，体验时间复利的回报\n2. 练习耐心倾听和深度情感交流\n3. 在行动前多思考潜在的后果，特别是对他人\n4. 尊重规则和他人的边界，理解自由也是有框架的\n5. 培养对抽象和深度话题的兴趣，拓展思维\n6. 选择一个长期项目坚持到底，不因新鲜感而转移\n7. 定期做自我反思，记录自己的成长和情感变化","figures":["欧内斯特·海明威","唐纳德·特朗普","麦当娜","布鲁斯·威利斯","泰迪·罗斯福","温斯顿·丘吉尔","詹姆斯·邦德(原型)"]},
  "ESFP":{"type":"ESFP","name":"表演者","features":["热情开朗","富有感染力","善于社交","享受当下","乐观积极","慷慨大方","活力四射"],"desc":"ESFP 是为舞台而生的人间欢乐使者，约占人口 8%。他们的热情具有感染力，走到哪里就把快乐带到哪里。ESFP 全身心地活在当下，享受生活的每一刻——美食、音乐、舞蹈、开怀大笑——他们不是不在意未来，而是知道此刻才是我们真正拥有的一切。\n\n他们对他人的情绪有着天然的雷达，总能在正确的时机用正确的方式点燃气氛或送上安慰。ESFP 不喜欢压力和冲突，他们更相信笑容和善意能够化解一切隔阂。在 ESFP 的世界里，生活本身就是一场值得全情投入的演出，而他们永远是最闪耀的那束光。","strengths":["极强的社交感染力和魅力，天然的气氛制造者","善于观察和回应他人需求，共情力强","适应力超强，随遇而安，无所畏惧","乐观积极，能在最灰暗的时刻找到光亮","慷慨大方，乐于分享自己拥有的一切","实际的动手能力，能把想法立刻变成行动","对他人的情绪变化有超乎寻常的敏锐感知"],"weaknesses":["容易分心，难以专注在需要长期投入的目标上","对批评和负面反馈非常敏感，内心容易受伤","不善于规划和管理资源，可能陷入财务困境","可能过于追求即时满足而牺牲长远利益","在需要深度分析和理论思考时感到力不从心","有时过于关注表面的快乐而回避深层问题","可能因害怕无聊而不断追求新刺激导致不稳定"],"careers":[{"title":"演员/表演艺术家","reason":"天生的表现力和感染力"},{"title":"导游/旅游策划","reason":"热爱分享体验且社交能力出色"},{"title":"活动主持人","reason":"善于调动气氛和与各色人等互动"},{"title":"时尚/美妆达人","reason":"对美和潮流有敏锐的触觉"},{"title":"销售/客户经理","reason":"出色的沟通和关系建立能力"},{"title":"幼教/儿童娱乐","reason":"天性活泼且善于和孩子打成一片"},{"title":"健身教练","reason":"用热情激励他人改变生活"},{"title":"音乐表演者","reason":"享受舞台和与观众的即时情感连接"}],"relationships":"ESFP 在关系中慷慨而充满热情。他们会用最热烈和有趣的方式表达爱意，把每一天都过成值得庆祝的日子。和 ESFP 恋爱就像坐上了一辆永远充满音乐的敞篷车——风光无限，笑声不断。\n\nESFP 需要的是能欣赏他们活力和热情、同时也能给予他们稳定感和安全感的伴侣。他们的挑战是：学会在热情之外也投入持续的耐心和坚持，不为一时冲动而放弃值得珍惜的关系。真正的爱不只是盛大的烟火，也是烟火散尽后依然愿意并肩看夜空的陪伴。","development":"1. 建立基本的时间管理和财务规划习惯\n2. 学习在面对困难时不逃避而是坚持到底\n3. 培养深度思考和定期反思的能力\n4. 接受生活中不全是快乐，也需要面对和处理痛苦\n5. 在社交投入之余留出独处的充电和思考时间\n6. 选择一个长期目标并制定分期计划\n7. 学习延迟满足，体验付出后的长期回报","figures":["玛丽莲·梦露","埃尔维斯·普雷斯利","威尔·史密斯","阿黛尔","史蒂夫·欧文","贾斯汀·比伯","碧梨"]}

// 按版本选取固定题目子集，保证同一版本每次题目一致且测量准确
const VERSION_CONFIG = {
  basic:    { forward: 3, reverse: 3 },   // 24 题：每维度 3F+3R
  advanced: { forward: 10, reverse: 10 }, // 80 题：每维度 10F+10R
  full:     { forward: 15, reverse: 15 }  // 120 题：每维度全部 15F+15R
};

function generateQuestions(version) {
  const config = VERSION_CONFIG[version];
  const dims = ['EI', 'SN', 'TF', 'JP'];
  const questions = [];
  let id = 1;

  dims.forEach(function(dim) {
    const pool = questionPool[dim];
    const fwd = pool.filter(function(q) { return q.direction === 1; });
    const rev = pool.filter(function(q) { return q.direction === -1; });

    // 取前 N 道正向题
    for (let i = 0; i < config.forward; i++) {
      questions.push({
        id: id,
        text: fwd[i].text,
        dimension: dim,
        direction: fwd[i].direction
      });
      id++;
    }

    // 取前 N 道反向题
    for (let i = 0; i < config.reverse; i++) {
      questions.push({
        id: id,
        text: rev[i].text,
        dimension: dim,
        direction: rev[i].direction
      });
      id++;
    }
  });

  // 乱序排列，避免正向/反向题集中出现
  questions.sort(function() { return Math.random() - 0.5; });
  questions.forEach(function(q, i) { q.id = i + 1; });

  return questions;
}

window.QUESTIONS = {
  basic: generateQuestions('basic'),
  advanced: generateQuestions('advanced'),
  full: generateQuestions('full')
};

/* ========== 2. 评分逻辑 (scoring.js) ========== */
window.SCORING = {
  calculate: function(answers, questions) {
    // answers: { questionId: score (-3 to +3) }
    // Returns: { type: "INTJ", scores: { EI, SN, TF, JP }, raw: { E, I, S, N, T, F, J, P } }

    const raw = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };

    questions.forEach(function(q) {
      const score = answers[q.id] || 0;
      const dim = q.dimension;

      if (dim === 'EI') {
        if (q.direction === 1) {
          // agree = more E
          if (score > 0) raw.E += score;
          else raw.I += Math.abs(score);
        } else {
          // agree = more I (reverse)
          if (score > 0) raw.I += score;
          else raw.E += Math.abs(score);
        }
      } else if (dim === 'SN') {
        if (q.direction === 1) {
          if (score > 0) raw.S += score;
          else raw.N += Math.abs(score);
        } else {
          if (score > 0) raw.N += score;
          else raw.S += Math.abs(score);
        }
      } else if (dim === 'TF') {
        if (q.direction === 1) {
          if (score > 0) raw.T += score;
          else raw.F += Math.abs(score);
        } else {
          if (score > 0) raw.F += score;
          else raw.T += Math.abs(score);
        }
      } else if (dim === 'JP') {
        if (q.direction === 1) {
          if (score > 0) raw.J += score;
          else raw.P += Math.abs(score);
        } else {
          if (score > 0) raw.P += score;
          else raw.J += Math.abs(score);
        }
      }
    });

    const type = (raw.E >= raw.I ? 'E' : 'I') +
                 (raw.S >= raw.N ? 'S' : 'N') +
                 (raw.T >= raw.F ? 'T' : 'F') +
                 (raw.J >= raw.P ? 'J' : 'P');

    // Max possible raw score per dimension for percentage normalization
    const maxEI = raw.E + raw.I || 1;
    const maxSN = raw.S + raw.N || 1;
    const maxTF = raw.T + raw.F || 1;
    const maxJP = raw.J + raw.P || 1;

    return {
      type: type,
      scores: {
        EI: Math.round((raw.E / maxEI) * 100),
        SN: Math.round((raw.S / maxSN) * 100),
        TF: Math.round((raw.T / maxTF) * 100),
        JP: Math.round((raw.J / maxJP) * 100)
      },
      raw: raw
    };
  }
};

/* ========== 3. 图表渲染 (charts.js) ========== */
window.drawRadarChart = function(canvas, scores) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth || 300;
  const size = Math.min(w, 300);
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.scale(dpr, dpr);

  const cx = size / 2;
  const cy = size / 2;
  const radius = size * 0.33;
  const levels = 4;
  const dims = [
    { key: 'EI', label: '外向 E / 内向 I' },
    { key: 'SN', label: '感觉 S / 直觉 N' },
    { key: 'TF', label: '思考 T / 情感 F' },
    { key: 'JP', label: '判断 J / 感知 P' }
  ];
  const numDims = dims.length;

  // Background grid
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  for (let lvl = 1; lvl <= levels; lvl++) {
    const r = (radius / levels) * lvl;
    ctx.beginPath();
    for (let i = 0; i < numDims; i++) {
      const angle = (Math.PI * 2 / numDims) * i - Math.PI / 2;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }

  // Axis lines
  for (let i = 0; i < numDims; i++) {
    const angle = (Math.PI * 2 / numDims) * i - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + radius * Math.cos(angle), cy + radius * Math.sin(angle));
    ctx.strokeStyle = '#e2e8f0';
    ctx.stroke();
  }

  // Data area
  ctx.beginPath();
  for (let i = 0; i < numDims; i++) {
    const angle = (Math.PI * 2 / numDims) * i - Math.PI / 2;
    const val = scores[dims[i].key] / 100;
    const r = radius * val;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(102, 126, 234, 0.2)';
  ctx.fill();
  ctx.strokeStyle = '#667eea';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Data points
  for (let i = 0; i < numDims; i++) {
    const angle = (Math.PI * 2 / numDims) * i - Math.PI / 2;
    const val = scores[dims[i].key] / 100;
    const r = radius * val;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#667eea';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Labels
  ctx.fillStyle = '#4a5568';
  ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < numDims; i++) {
    const angle = (Math.PI * 2 / numDims) * i - Math.PI / 2;
    const labelR = radius + 50;
    const x = cx + labelR * Math.cos(angle);
    const y = cy + labelR * Math.sin(angle);

    // Percentage
    ctx.fillStyle = '#667eea';
    ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
    const pctR = radius + 25;
    const px = cx + pctR * Math.cos(angle);
    const py = cy + pctR * Math.sin(angle);
    ctx.fillText(scores[dims[i].key] + '%', px, py);

    // Label
    ctx.fillStyle = '#4a5568';
    ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
    // 简单方案：不调对齐，直接画
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(dims[i].label, x, y);
  }
};

    for (var i = -3; i <= 3; i++) {
      var dot = document.createElement('div');
      dot.className = 'scale-dot';
      dot.setAttribute('data-value', i);
      if (answers[q.id] === i) {
        dot.classList.add('selected');
      }
      dot.addEventListener('click', (function(val) {
        return function() {
          answers[q.id] = val;
          renderScaleSelection(q.id);
          updateNavButtons();
        };
      })(i));
      scaleDots.appendChild(dot);
    }

    updateNavButtons();
  }

  function renderScaleSelection(qid) {
    var dots = scaleDots.querySelectorAll('.scale-dot');
    dots.forEach(function(d) {
      var val = parseInt(d.getAttribute('data-value'));
      if (val === answers[qid]) {
        d.classList.add('selected');
      } else {
        d.classList.remove('selected');
      }
    });
  }

  function updateNavButtons() {
    var isFirst = currentIndex === 0;
    var isLast = currentIndex === questions.length - 1;
    var allAnswered = questions.every(function(q) { return answers[q.id] !== undefined; });
    var unanswered = questions.filter(function(q) { return answers[q.id] === undefined; }).length;

    btnPrev.disabled = isFirst;
    if (isLast) {
      btnNext.style.display = 'none';
      btnSubmit.style.display = 'inline-block';
      btnSubmit.disabled = !allAnswered;
      if (!allAnswered) {
        submitHint.style.display = 'inline-flex';
        submitHint.textContent = '请答完剩余 ' + unanswered + ' 题后再提交';
      } else {
        submitHint.style.display = 'none';
      }
    } else {
      btnNext.style.display = 'inline-block';
      btnSubmit.style.display = 'none';
      submitHint.style.display = 'none';
    }
  }

  // --- Navigation ---
  btnPrev.addEventListener('click', function() {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuiz();
    }
  });

  btnNext.addEventListener('click', function() {
    var q = questions[currentIndex];
    if (answers[q.id] === undefined) {
      // Require answer
      var dots = scaleDots.querySelectorAll('.scale-dot');
      dots.forEach(function(d) { d.style.borderColor = '#fc8181'; });
      setTimeout(function() {
        dots.forEach(function(d) { d.style.borderColor = ''; });
      }, 600);
      return;
    }
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderQuiz();
    }
  });

  btnSubmit.addEventListener('click', function() {
    // 确保所有题目都已作答
    var allAnswered = questions.every(function(q) { return answers[q.id] !== undefined; });
    if (!allAnswered) {
      alert('请先完成所有题目！');
      return;
    }

    try {
      var result = window.SCORING.calculate(answers, questions);
      var typeCode = result.type;
      var scores = result.scores;

      // 生成报告
      var reportHTML = window.generateReport(typeCode, scores);
      if (!reportHTML || reportHTML.includes('undefined')) {
        throw new Error('报告生成失败');
      }
      
      reportPage.innerHTML = reportHTML;
      showPage(reportPage);

      // 保存结果，下次打开时直接显示
      localStorage.setItem('mbti_result', JSON.stringify({
        typeCode: typeCode,
        scores: scores,
        version: currentVersion
      }));

      // 等待DOM更新后绘制雷达图
      setTimeout(function() {
        var canvas = document.getElementById('radar-canvas');
        if (canvas) {
          window.drawRadarChart(canvas, scores);
        }
      }, 50);
    } catch (error) {
      console.error('提交错误:', error);
      alert('提交失败，请刷新页面重试。错误：' + error.message);
    }
  });

  // Keyboard navigation
  document.addEventListener('keydown', function(e) {
    if (!quizPage.classList.contains('active')) return;
    if (e.key === 'ArrowLeft' && currentIndex > 0) {
      currentIndex--;
      renderQuiz();
    } else if (e.key === 'ArrowRight' && currentIndex < questions.length - 1) {
      var q = questions[currentIndex];
      if (answers[q.id] !== undefined) {
        currentIndex++;
        renderQuiz();
      }
    }
  });

})();
  </script>
</body>
</html>
